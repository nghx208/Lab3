<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Introduction to basic HTML elements">
    <meta name="keywords" content="HTML, Doctype, Head, Body, Meta, Paragraph, Headings, Strong, Emphasis">
    <meta name="Gia Nghia" content="Your Name">
    <title>Document</title>
</head>
<body>
    <!-- Logo -->
    <a href= "https://www.swinburne.edu.au/"><img src="swin_logo.png" alt="Swinburne Logo" width="200"></a>
    <!-- Heading -->
    <h1><strong>CWA Help Desk Appointment</strong></h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check blackboard for when CWA tutors will be there.</p>
            <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
        <!-- Field set for Student details -->
        <fieldset>  
            <legend>Student details</legend>      
        <label for="StudentID">Student ID:</label>
        <input type="text" name="StudentID" id="studentid" pattern="\d{7,10}" required>
        <br><br>
        <label for="GivenName">Given Name:</label>
        <input type="text" id="GivenName" name="GivenName" required>
        <label for="FamilyName">Family Name:</label>
        <input type="text" id="FamilyName" name="FamilyName" required>
        </fieldset>
        <!-- Field set for student unit & student tutor -->
        <fieldset>  
            <legend>Your unit</legend>      
        <input type="radio" id="unit1" name="unit" value="COS10011" required>
        <label for="unit1">COS10011</label>
        <input type="radio" id="unit2" name="unit" value="COS60004" required>
        <label for="unit2">COS60004</label>
        <input type="radio" id="unit3" name="unit" value="COS60007" required>
        <label for="unit3">COS60007</label>

        <br><br>
        <label for="tutor">Your tutor</label>
        <select id="tutor" name="tutor" required>
            <option value="">Please select</option>
            <option value="Razeen"> Razeen</option>
            <option value="Atie">Atie</option>
            <option value="Nick">Nick</option>
            <option value="Feixue">Feixue</option>
            <option value="Rahul">Rahul</option>
        </select>
        </fieldset>
        <fieldset>  
            <!-- Field set for student issue -->
            <legend>Issue</legend>
            <input type="checkbox" id="issue1" name="issue" value="HTML">
            <label for="issue1">HTML</label>
            <input type="checkbox" id="issue2" name="issue" value="CSS">
            <label for="issue2">CSS</label>
            <input type="checkbox" id="issue3" name="issue" value="JavaScript">
            <label for="issue3">JavaScript</label>
            <input type="checkbox" id="issue4" name="issue" value="PHP">
            <label for="issue4">PHP</label>
            <input type="checkbox" id="issue5" name="issue" value="MySQL">
            <label for="issue5">MySQL</label>
            <br><br>
            <label for="description">Description of Issue</label>
            <br>
            <textarea id="description" name="description" rows="4" cols="50" placeholder="Write description of your problem here..."></textarea>
        </fieldset>

            <fieldset>
                <!-- Field set for preferred date and time -->
                <legend>Preferred Date / Time</legend>
                <label for="date">Date</label>
                <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}" required>
                <br>
                <label for="time">Time</label>
                <input type="text" name="time" id="time" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" required>
            </fieldset>
        <input type="submit" value="Book">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
